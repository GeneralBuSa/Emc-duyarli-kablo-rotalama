<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="__CSP__">
<title>Kablo Demeti 3B</title>
<meta name="description" content="">
<script>
  // Saved theme choice (light / dark) before the first paint; "system" follows the OS setting.
  try { const t = localStorage.getItem("emc-kablo:theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<style>
__STYLE__</style>
</head>
<body>
<main>
  <header class="top">
    <div>
      <h1 data-i18n="header.title">Kablo demeti rotalama — etkileşimli 3B görünüm</h1>
      <p class="lead" data-i18n="header.lead"></p>
    </div>
    <div class="top-actions">
      <button type="button" class="icon-btn" id="tour-btn" data-i18n-aria="tour.start" data-i18n-title="tour.start">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.2"/><path d="M9.6 9.3a2.5 2.5 0 0 1 4.85.85c0 1.7-2.45 2.2-2.45 3.85"/><circle class="dot" cx="12" cy="17.1" r=".6"/></svg>
      </button>
      <div class="seg seg-sm" id="lang" role="radiogroup" data-i18n-aria="lang.aria">
        <button type="button" role="radio" data-lang="tr" lang="tr" aria-checked="false">TR</button>
        <button type="button" role="radio" data-lang="en" lang="en" aria-checked="false">EN</button>
      </div>
      <button type="button" class="theme-switch" id="theme" role="switch" aria-checked="false" data-i18n-aria="theme.aria">
        <span class="ts-track" aria-hidden="true">
          <svg class="ts-ico sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="ts-ico moon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
          <span class="ts-thumb"></span>
        </span>
      </button>
    </div>
  </header>
  <div class="tabs" role="tablist" id="tabs" data-i18n-aria="tabs.aria"></div>
  <section id="panel" role="tabpanel" tabindex="-1">
    <p class="summary" id="summary" aria-live="polite"></p>
    <details class="statsbox" id="statsbox">
      <summary data-i18n="stats.summary"></summary>
      <div class="stats" id="stats"></div>
    </details>
    <div class="viewer" id="viewer">
      <div class="loading" id="loading" data-i18n="loading"></div>
      <div class="hud caption" id="caption"></div>
      <div class="hud status" id="status" aria-live="polite"></div>
      <div class="hud legend" id="legend"></div>
      <div class="hud playbar" id="playbar">
        <button type="button" class="play" id="play" data-i18n-aria="play.aria">
          <svg class="ico play-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"/></svg>
          <svg class="ico pause-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"/></svg>
          <span class="play-text" data-i18n="play.play"></span>
        </button>
        <input type="range" class="scrub" id="scrub" min="0" max="1" step="0.001" value="1" data-i18n-aria="scrub.aria">
        <div class="seg seg-hud" id="speed" role="radiogroup" data-i18n-aria="speed.aria">
          <button type="button" role="radio" data-speed="0.5" aria-checked="false">0,5×</button>
          <button type="button" role="radio" data-speed="1" aria-checked="true">1×</button>
          <button type="button" role="radio" data-speed="2" aria-checked="false">2×</button>
          <button type="button" role="radio" data-speed="4" aria-checked="false">4×</button>
        </div>
      </div>
      <button type="button" class="hud fs-btn" id="fullscreen" data-i18n-aria="fs.enter" data-i18n-title="fs.enterTitle">
        <svg class="ico fs-enter" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>
        <svg class="ico fs-exit" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4v5H4M20 9h-5V4M15 20v-5h5M4 15h5v5"/></svg>
      </button>
      <div class="tip" id="tip"></div>
    </div>
    <div class="toolbar" id="toolbar">
      <div class="tb-group">
        <span class="tb-label" id="views-label" data-i18n="toolbar.views"></span>
        <div class="seg" id="views" role="radiogroup" aria-labelledby="views-label"></div>
      </div>
      <div class="tb-group tb-layers">
        <span class="tb-label" id="layers-label" data-i18n="toolbar.layers"></span>
        <div class="chips" id="chips" role="group" aria-labelledby="layers-label"></div>
      </div>
    </div>
    <div class="selinfo" id="selinfo"></div>
    <h2 data-i18n="cables.heading"></h2>
    <div class="tablewrap">
      <table class="data" id="cabletable">
        <caption data-i18n="cables.caption"></caption>
        <thead><tr>
          <th scope="col" data-i18n="th.cable"></th><th scope="col" data-i18n="th.class"></th>
          <th scope="col" data-i18n="th.route"></th><th scope="col" class="num" data-i18n="th.length"></th>
          <th scope="col" class="num" data-i18n="th.emc"></th><th scope="col" class="num" data-i18n="th.bend"></th>
          <th scope="col" class="num" data-i18n="th.keepout"></th><th scope="col" class="num" data-i18n="th.parallel"></th>
          <th scope="col" data-i18n="th.status"></th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>
  <h2 data-i18n="compare.heading"></h2>
  <div class="tablewrap">
    <table class="data" id="compare">
      <caption data-i18n="compare.caption"></caption>
      <thead><tr>
        <th scope="col" data-i18n="th.method"></th><th scope="col" data-i18n="th.total"></th>
        <th scope="col" class="num" data-i18n="th.bundling"></th><th scope="col" data-i18n="th.checks"></th>
      </tr></thead>
      <tbody></tbody>
    </table>
  </div>
  <footer>
    <div>
      <h3 data-i18n="footer.real"></h3>
      <ul>
        <li data-i18n-html="footer.real1"></li>
        <li data-i18n="footer.real2"></li>
        <li data-i18n="footer.real3"></li>
      </ul>
    </div>
    <div>
      <h3 data-i18n="footer.visual"></h3>
      <ul>
        <li data-i18n="footer.visual1"></li>
        <li data-i18n="footer.visual2"></li>
        <li data-i18n="footer.visual3"></li>
      </ul>
    </div>
  </footer>
</main>
<div class="tour-ring" id="tour-ring" hidden></div>
<div class="tour-pop" id="tour-pop" role="dialog" aria-modal="false" aria-labelledby="tour-title" hidden>
  <div class="tour-head">
    <span class="tour-count" id="tour-count"></span>
    <button type="button" class="tour-x" id="tour-close" data-i18n-aria="tour.close" data-i18n-title="tour.close">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <h3 id="tour-title"></h3>
  <p id="tour-body"></p>
  <div class="tour-foot">
    <div class="tour-dots" id="tour-dots" aria-hidden="true"></div>
    <div class="tour-actions">
      <button type="button" class="tour-back" id="tour-back" data-i18n="tour.back"></button>
      <button type="button" class="tour-next" id="tour-next"></button>
    </div>
  </div>
</div>

<script id="data" type="application/json">__DATA_JSON__</script>
<script id="i18n" type="application/json">__I18N_JSON__</script>
<script>
  // Runtime errors are collected for automated checks (tests, README image capture).
  window.__viewerErrors = [];
  addEventListener("error", e => window.__viewerErrors.push(String(e.message || e)));
  addEventListener("unhandledrejection", e => window.__viewerErrors.push(String(e.reason)));
</script>
<script>
__I18N_SCRIPT__</script>
<script>
__THREE_BUNDLE__</script>
<script type="module">
__SCRIPT__</script>
</body>
</html>
